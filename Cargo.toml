[package]
name = "bbt-bibtex-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "BibTeX parser for Better BibTeX 4 zotero"
repository = "https://github.com/retorquere/bibtex-parser.git"
readme = "README.md"
license = "MIT"
keywords = ["bibtex", "parser", "bibliography", "latex"]
categories = ["parser-implementations", "text-processing"]
include = ["/Cargo.toml", "/README.md", "/LICENSE", "/build.rs", "/build/*.rs", "/data/**", "/shared/**", "/src/**"]

[profile.release]
lto = true

[features]
[workspace]
members = ["xtask"]
resolver = "3"

[lib]
name = "bibtex_parser"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
indexmap = { version = "2", features = ["serde"] }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
unicode-general-category = "1.1"
unicode-normalization = "0.1"
wasm-bindgen = "0.2"
wildflower = "0.3"

[build-dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
wasm-bindgen-futures = "0.4"
