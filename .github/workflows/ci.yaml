name: test & publish

on:
  push:
  workflow_dispatch:

jobs:
  cancel_master:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: cancel matching master run on tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/github-script@v9
      with:
        script: |
          const { owner, repo } = context.repo
          const { data } = await github.rest.actions.listWorkflowRuns({
            owner,
            repo,
            workflow_id: 'ci.yaml',
            head_sha: context.sha,
            per_page: 100,
          })
          const masterRuns = data.workflow_runs.filter(run =>
            run.id !== context.runId &&
            run.head_branch === 'master' &&
            run.event === 'push' &&
            run.status !== 'completed'
          )
          for (const run of masterRuns) {
            await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id })
          }

  build:
    needs: cancel_master
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: install node
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'

    - name: install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: install wasm-pack
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack

    - name: build all parsers
      run: |
        npm install
        npm run build:all

    - name: upload parser build
      uses: actions/upload-artifact@v7
      with:
        name: parser-build
        path: |
          dist/
          rust/pkg/
        if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: ['typescript', 'wasm']
        sentencecase: ['on+guess', 'on', 'off']
        caseprotection: [ 'as-needed', 'strict', 'off' ]
        preservequoted: [ '-p', '-P' ]
    steps:
    - uses: actions/checkout@v7
    - name: install node
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
    - name: install node dependencies
      run: npm install
    - name: download parser build
      uses: actions/download-artifact@v8
      with:
        name: parser-build
        path: .
    - name: test ${{ matrix.library }} parser
      run: |
        case "${{ matrix.library }}" in
          typescript)
            ./test/js.js --sc ${{ matrix.sentencecase }} --cp ${{ matrix.caseprotection }} ${{ matrix.preservequoted }} --big
            ;;
          wasm)
            node test/wasm.js --sc ${{ matrix.sentencecase }} --cp ${{ matrix.caseprotection }} ${{ matrix.preservequoted }} --big
            node --test test/rust-wasm-parity.test.js
            ;;
          *)
            echo "Unsupported library: ${{ matrix.library }}" >&2
            exit 1
            ;;
        esac

  pages:
    needs: [cancel_master, test]
    if: (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && needs.test.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: install node
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
    - name: install node dependencies
      run: npm ci
    - name: download parser build
      uses: actions/download-artifact@v8
      with:
        name: parser-build
        path: .
    - name: generate documentation
      run: npm run docs --ignore-scripts -- --treatWarningsAsErrors
    - name: configure Pages
      uses: actions/configure-pages@v6
    - name: upload documentation
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./docs
    - name: deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v7
    - name: download parser build
      uses: actions/download-artifact@v8
      with:
        name: parser-build
        path: .
    - name: install node
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        registry-url: 'https://registry.npmjs.org'
    - name: publish
      run: npm publish --ignore-scripts --provenance --access public
