[package]
name = "bibtex-parser"
version = "0.1.0"
edition = "2024"
description = "Rust BibTeX parser with WebAssembly bindings"
repository = "https://github.com/retorquere/bibtex-parser.git"

[lib]
name = "bibtex_parser"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-general-category = "1.1"
regex-lite = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"