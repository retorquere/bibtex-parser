[package]
name = "rq-bibtex-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "BibTeX parser for Better BibTeX 4 zotero"
repository = "https://github.com/retorquere/bibtex-parser.git"
readme = "README.md"
license = "MIT"
keywords = ["bibtex", "parser", "bibliography", "latex"]
categories = ["parser-implementations", "text-processing"]
include = ["Cargo.toml", "README.md", "LICENSE", "data/**", "src/**"]

[lib]
name = "bibtex_parser"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-general-category = "1.1"
regex-lite = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
