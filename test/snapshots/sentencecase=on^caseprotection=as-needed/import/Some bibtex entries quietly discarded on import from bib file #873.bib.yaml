  - fields:
      annote: "Full version of conference papers Dean:93 also DeanETAL:93. Describes planning and deliberation scheduling methods for robot motion planning, based on Markov Decision Processes (MDPs). The method is essentially a cleaned up version of the method of Drummond and Bresina\_Drummond:90. See annotation to those papers, as well."
      author:
        - firstName: Thomas L.
          lastName: Dean
        - firstName: Leslie Pack
          lastName: Kaelbling
        - firstName: Jak
          lastName: Kirman
        - firstName: Ann N.
          lastName: Nicholson
      journal: AIJ
      number: 1/2
      pages: 35–74
      title: Planning under time constraints in stochastic domains
      volume: '76'
      year: '1995'
    input: "@article(DeanETAL:95,\n  AUTHOR =\t {Thomas L. Dean and Leslie Pack Kaelbling and Jak\n                  Kirman and Ann N. Nicholson},\n  TITLE =\t \"Planning under time constraints in Stochastic\n                  Domains\",\n  journal =\t AIJ,\n  YEAR =\t 1995,\n  volume =\t 76,\n  number =\t {1/2},\n  PAGES =\t {35--74},\n  annote =\t {Full version of conference papers \\cite{Dean:93}\n                  also \\cite{DeanETAL:93}. Describes planning and\n                  deliberation scheduling methods for robot motion\n                  planning, based on Markov Decision Processes\n                  (MDPs). The method is essentially a cleaned up\n                  version of the method of Drummond and\n                  Bresina~\\cite{Drummond:90}. See annotation to those\n                  papers, as well.}\n)"
    key: DeanETAL:95
    mode:
      annote: richtext
      author: creatorlist
      journal: literal
      number: literal
      pages: literal
      title: title
      volume: literal
      year: literal
    type: article
  - fields:
      annote: "Similar to Drummond and Bresina paper\_Drummond:90, indeed an attempt to put it on more secure theoretical footing. Project is trying to find a path through a state-space automaton. Deliberation scheduling in this framework is the allocation of resources between <i>policy generation</i> for a subgraph of the overall automaton and <i>envelope expansion</i> to consider a larger subset of the state space. Compares <i>precursor-deliberation</i>, where you develop the whole policy before any execution, and <i>recurrent-deliberation</i>, where the agent repeatedly replans."
      author:
        - firstName: Thomas L.
          lastName: Dean
        - firstName: Leslie Pack
          lastName: Kaelbling
        - firstName: Jak
          lastName: Kirman
        - firstName: Ann N.
          lastName: Nicholson
      crossref: UAI93
      keywords:
        - deliberation scheduling
      pages: 309–316
      title: Deliberation scheduling for time-critical sequential decision making
      year: '1993'
    input: |-
      @inproceedings{ DeanETAL:93,
          author = "Thomas L. Dean and Leslie Pack Kaelbling and Jak Kirman 
      and Ann N. Nicholson",
          title = "Deliberation scheduling for time-critical sequential decision making",
          crossref = {UAI93},
          pages = {309--316},
          year = "1993",
          keywords = {deliberation scheduling},
          annote = {Similar to Drummond and Bresina paper~\cite{Drummond:90},
          indeed an attempt to put it on more secure theoretical footing.
          Project is trying to find a path through a state-space automaton.
          Deliberation scheduling in this framework is the allocation of
          resources between \emph{policy generation} for a subgraph of the
          overall automaton and \emph{envelope expansion} to consider a
          larger subset of the state space.  Compares
          \emph{precursor-deliberation}, where you develop the whole policy
          before any execution, and \emph{recurrent-deliberation}, where the
          agent repeatedly replans.}
      }
