    type: inproceedings
  - fields:
      annote: >-
        LDS is a search technique that iteratively makes n decisions differently
        from the dictates of its heuristic, for increasing n. The intuition
        behind LDS is that heuristics often give recommendations that are worse
        at the start of the search than at the end. Accordingly, LDS makes
        divergent decisions initially at the beginning of the search path,
        working towards the end. Note that were this assumption wrong,
        depth-first search would work well, because it undoes decisions first at
        the end of the search. Harvey and Ginsberg also discuss combining LDS
        with bounded-backtrack search, which they show gives better behavior in
        large search spaces.
      author:
        - firstName: William D. Harvey
          lastName: andGINSBERG
      crossref: ijcai95
      pages: 607–613
      title: Limited discrepancy search
    input: "@INPROCEEDINGS(Harvey:IJCAI95,\n\tAUTHOR = {William D. Harvey and} # GINSBERG,\n\tTITLE = \"Limited Discrepancy Search\",\n\tPAGES = {607--613},\n\tCROSSREF = {ijcai95},\n\tANNOTE = {LDS is a search technique that iteratively makes $n$\n\t\t  decisions differently from the dictates of its heuristic, \n\t\t  for increasing $n$.  The intuition behind LDS is that \n\t\t  heuristics often give recommendations that are worse at\n\t\t  the start of the search than at the end.  Accordingly,\n\t\t  LDS makes divergent decisions initially at the beginning \n\t\t  of the search path, working towards the end.  Note that\n\t\t  were this assumption wrong, depth-first search would work\n\t\t  well, because it undoes decisions first at the end of \n\t\t  the search.  Harvey and Ginsberg also discuss combining\n\t\t  LDS with bounded-backtrack search, which they show gives\n\t\t  better behavior in large search spaces.} \n)"
    key: Harvey:IJCAI95
